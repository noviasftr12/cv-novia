<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .card-hover{
      transition: all 0.3s ease;
    }
    .card-hover:hover{
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="max-w-4xl w-full p-6">

    <!-- Title -->
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">
      🎓 Certificates
    </h2>

    <!-- Grid Certificates -->
    <div class="grid md:grid-cols-2 gap-6">

      <!-- Card 1 -->
      <div class="bg-white rounded-2xl p-5 shadow-md card-hover">
        <h3 class="text-xl font-semibold text-gray-800 mb-2">
          Panitia Porskam 2024
        </h3>
        <p class="text-gray-600 text-sm mb-3">
          Sertifikat Porskam 2024 sebagai divisi Dana Usaha
        </p>
        <span class="text-xs bg-blue-100 text-blue-600 px-3 py-1 rounded-full">
          2024
        </span>
      </div>

      <!-- Card 2 -->
      <div class="bg-white rounded-2xl p-5 shadow-md card-hover">
        <h3 class="text-xl font-semibold text-gray-800 mb-2">
          Organisasi Kampus
        </h3>
        <p class="text-gray-600 text-sm mb-3">
          Sertifikat Organisasi kampus sebaga departemen kewirausahaan.
        </p>
        <span class="text-xs bg-green-100 text-green-600 px-3 py-1 rounded-full">
          2025
        </span>
      </div>

      <!-- Card 3 -->
      <div class="bg-white rounded-2xl p-5 shadow-md card-hover">
        <h3 class="text-xl font-semibold text-gray-800 mb-2">
          Panitia expo
        </h3>
        <p class="text-gray-600 text-sm mb-3">
          Sertifikat expo sebagai divisi konsumsi
        </p>
        <span class="text-xs bg-purple-100 text-purple-600 px-3 py-1 rounded-full">
          2026
        </span>
      </div>

    </div>

  </div>

</body>
</html>
