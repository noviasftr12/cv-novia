<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Online - SPA</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .menu-active {
      background:#f472b6;
      color:white;
    }

    .nav-link {
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      background:#f472b6;
      color:white;
    }

    .fade-enter {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {opacity:0; transform:translateY(10px);}
      to {opacity:1; transform:translateY(0);}
    }
  </style>
</head>

<body class="bg-gradient-to-br from-pink-100 via-rose-100 to-purple-100 min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-pink-200 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">

      <!-- Logo -->
      <h1 class="text-pink-800 font-bold text-lg">Tentang Novia</h1>

      <!-- Hamburger Button -->
      <button id="menuToggle" class="text-pink-800 md:hidden text-2xl">
        ☰
      </button>

      <!-- Menu Desktop -->
      <div id="menuList" class="hidden md:flex flex-wrap gap-2">

        <a href="#" class="menu nav-link menu-active px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="home.html">Home</a>
        <a href="#" class="menu nav-link px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="about.html">About</a>
        <a href="#" class="menu nav-link px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="skill.html">Skills</a>
        <a href="#" class="menu nav-link px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="educated.html">Education</a>
        <a href="#" class="menu nav-link px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="experience.html">Experience</a>
        <a href="#" class="menu nav-link px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="github.html">Portfolio</a>
        <a href="#" class="menu nav-link px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="certificate.html">Certificates</a>
        <a href="#" class="menu nav-link px-4 py-2 rounded-lg text-pink-800 text-sm" data-page="contact.html">Contact</a>

      </div>

    </div>

    <!-- MOBILE MENU -->
    <div id="mobileMenu" class="hidden flex-col px-4 pb-4 md:hidden bg-pink-200">

      <a href="#" class="menu block nav-link menu-active px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="home.html">Home</a>
      <a href="#" class="menu block nav-link px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="about.html">About</a>
      <a href="#" class="menu block nav-link px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="skill.html">Skills</a>
      <a href="#" class="menu block nav-link px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="educated.html">Education</a>
      <a href="#" class="menu block nav-link px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="experience.html">Experience</a>
      <a href="#" class="menu block nav-link px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="github.html">Portfolio</a>
      <a href="#" class="menu block nav-link px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="certificate.html">Certificates</a>
      <a href="#" class="menu block nav-link px-4 py-2 rounded-lg text-pink-800 text-sm mb-1" data-page="contact.html">Contact</a>

    </div>
  </nav>

  <!-- CONTENT -->
  <div id="content" class="max-w-5xl mx-auto p-4"></div>

  <!-- SCRIPT -->
  <script>
  $(document).ready(function(){

    loadPage('home.html');

    $('#menuToggle').click(function(){
      $('#mobileMenu').slideToggle(200);
    });

    $(document).on('click', '.menu', function(e){
      e.preventDefault();

      $('.menu').removeClass('menu-active');
      $(this).addClass('menu-active');

      let page = $(this).data('page');
      loadPage(page);

      $('#mobileMenu').slideUp(200);
    });

    function loadPage(page){
      $('#content').fadeOut(150,function(){
        $('#content').load(page,function(){
          $('#content').addClass('fade-enter').fadeIn(200);
        });
      });
    }

  });
  </script>

</body>
</html>
