<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio GitHub</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-gray-100 min-h-screen px-4 py-10">

  <div class="max-w-5xl mx-auto">

    <!-- CARD UTAMA (SAMA SEPERTI HOME) -->
    <div class="bg-white rounded-3xl shadow-xl p-8 card-hover">

      <!-- HEADER -->
      <div class="flex flex-col md:flex-row justify-between items-end gap-6 border-b border-gray-200 pb-6">

        <div>
          <h2 class="text-3xl md:text-4xl font-bold text-gray-800">
            💻 Project GitHub
          </h2>
          <p class="text-gray-500 mt-2 text-sm">
            Data project diambil langsung dari GitHub API
          </p>
        </div>

        <div class="flex items-center gap-2 bg-blue-100 px-4 py-2 rounded-full">
          <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
          <span class="text-xs font-semibold text-blue-600">
            Live Data
          </span>
        </div>

      </div>

      <!-- GRID PROJECT -->
      <div id="github-projects" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">

        <!-- LOADING -->
        <div class="col-span-full text-center py-10">
          <div class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-gray-500 mt-3 text-sm">
            Memuat data project...
          </p>
        </div>

      </div>

    </div>

  </div>

<script>
$(document).ready(function() {

    const username = 'Noviasftr12';
    const projectContainer = $('#github-projects');

    $.ajax({
        url: "https://api.github.com/users/" + username + "/repos?sort=updated&per_page=6",
        method: "GET",
        dataType: "json",
        success: function(repos) {

            let cards = "";

            if (repos.length === 0) {
                projectContainer.html('<p class="col-span-full text-center text-gray-500">Tidak ada project ditemukan</p>');
                return;
            }

            repos.forEach(function(repo) {

                const description = repo.description || "Project pengembangan web modern.";
                const language = repo.language || "Web";

                cards += `
                <a href="${repo.html_url}" target="_blank"
                   class="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm hover:shadow-lg hover:-translate-y-2 transition duration-300">

                  <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-semibold text-blue-500">${language}</span>
                    <span class="text-gray-400 text-sm">↗</span>
                  </div>

                  <h3 class="text-lg font-semibold text-gray-800 mb-2 hover:text-blue-500 transition">
                    ${repo.name}
                  </h3>

                  <p class="text-gray-500 text-sm mb-4">
                    ${description}
                  </p>

                  <div class="flex gap-4 text-sm text-gray-400">
                    <span>⭐ ${repo.stargazers_count}</span>
                    <span>🍴 ${repo.forks_count}</span>
                  </div>

                </a>
                `;
            });

            projectContainer.html(cards);
        },

        error: function() {
            projectContainer.html('<p class="col-span-full text-center text-red-500 font-semibold">Gagal mengambil data GitHub</p>');
        }
    });

});
</script>

</body>
</html>
