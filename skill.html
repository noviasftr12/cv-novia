<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
    }

    .progress-bar {
      transition: width 1s ease-in-out;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen py-10 px-4">

  <div class="max-w-4xl mx-auto">

    <!-- Header -->
    <div class="text-center mb-10">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-800">
        🚀 Skills
      </h2>
      <p class="text-gray-500 mt-2">
        Kemampuan teknis yang saya kuasai
      </p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-lg p-6 card-hover">

      <!-- Skill 1 -->
      <div class="mb-5">
        <div class="flex justify-between mb-1">
          <span class="text-gray-700 font-medium">HTML, CSS, JavaScript</span>
          <span class="text-sm text-gray-500">70%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div class="bg-blue-500 h-3 rounded-full progress-bar" style="width:85%"></div>
        </div>
      </div>

      <!-- Skill 2 -->
      <div class="mb-5">
        <div class="flex justify-between mb-1">
          <span class="text-gray-700 font-medium">PHP & MySQL</span>
          <span class="text-sm text-gray-500">75%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div class="bg-green-500 h-3 rounded-full progress-bar" style="width:75%"></div>
        </div>
      </div>

      <!-- Skill 3 -->
      <div class="mb-5">
        <div class="flex justify-between mb-1">
          <span class="text-gray-700 font-medium">jQuery</span>
          <span class="text-sm text-gray-500">70%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div class="bg-purple-500 h-3 rounded-full progress-bar" style="width:70%"></div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
