<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom Animation */
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen py-10 px-4">

  <div class="max-w-4xl mx-auto">

    <!-- Header -->
    <div class="text-center mb-10">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-800">
        🎓 Education
      </h2>
      <p class="text-gray-500 mt-2">
        Riwayat pendidikan saya
      </p>
    </div>

    <!-- Timeline -->
    <div class="relative border-l-4 border-blue-500 pl-6 space-y-8">

      <!-- Item 1 -->
      <div class="bg-white p-5 rounded-2xl shadow-md card-hover relative">

        <!-- Dot -->
        <div class="absolute -left-3 top-6 w-6 h-6 bg-blue-500 rounded-full border-4 border-white"></div>

        <!-- Content -->
        <h3 class="text-lg font-semibold text-gray-800">
          Universitas Masoem
        </h3>

        <p class="text-gray-600 text-sm mt-1">
          Program Komputerisasi Akuntansi
        </p>

        <span class="inline-block mt-3 text-xs bg-blue-100 text-blue-600 px-3 py-1 rounded-full">
          2024 - Sekarang
        </span>

      </div>

      <!-- Item 2 (opsional tambahan) -->
      <div class="bg-white p-5 rounded-2xl shadow-md card-hover relative">

        <div class="absolute -left-3 top-6 w-6 h-6 bg-green-500 rounded-full border-4 border-white"></div>

        <h3 class="text-lg font-semibold text-gray-800">
          MAN
        </h3>

        <p class="text-gray-600 text-sm mt-1">
          Jurusan IPS
        </p>

        <span class="inline-block mt-3 text-xs bg-green-100 text-green-600 px-3 py-1 rounded-full">
          2020 - 2023
        </span>

      </div>

    </div>

  </div>

</body>
</html>
