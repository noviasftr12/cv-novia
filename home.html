<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .card-hover {
      transition: all 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-gray-100 min-h-screen flex items-center justify-center px-4">

  <div class="max-w-4xl w-full">

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl p-8 text-center card-hover">

      <!-- Foto -->
      <div class="flex justify-center mb-6">
        <img src="aku.jpg" alt="Foto Profil"
          class="w-36 h-36 object-cover rounded-full border-4 border-blue-500 shadow-lg">
      </div>

      <!-- Nama -->
      <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">
        Novia Safitri
      </h2>

      <!-- Role -->
      <p class="text-blue-500 font-medium mb-4">
         Portofolio
      </p>

      <!-- Deskripsi -->
      <p class="text-gray-600 leading-relaxed max-w-xl mx-auto">
        Halo! Saya adalah mahasiswa yang memiliki minat besar dalam 
        pengembangan website modern. Saya senang membangun aplikasi 
        yang responsif, interaktif, dan memiliki tampilan yang menarik.
      </p>

      <!-- Divider -->
      <div class="my-6 border-t"></div>

      <!-- Button -->
      <div class="flex justify-center gap-4 flex-wrap">

        

      </div>

    </div>

  </div>

</body>
</html>
